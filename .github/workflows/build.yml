name: Build Android Bundle Definitivo

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Entorno Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar y Configurar Gradle CLI
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Crear local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Compilar AAB de Release Directamente
        run: gradle bundleRelease --stacktrace

      - name: Subir Archivo AAB a Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: '**/build/outputs/bundle/release/*.aab'
          retention-days: 7
