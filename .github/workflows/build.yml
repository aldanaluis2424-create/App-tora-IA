name: Build Android Bundle Definitivo

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Generar Keystore de Firma Temporal
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore release.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Reparar Permisos y Generar Gradle Wrapper
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Compilar AAB
        env:
          GEMINI_API_KEY: "DUMMY_KEY_FOR_BUILD"
          ANDROID_KEYSTORE_PATH: "release.keystore"
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Buscar y Subir el archivo AAB resultante
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: '**/*.aab'
