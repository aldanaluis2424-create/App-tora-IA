name: Build Android Bundle Definitivo

on:
  push:
    branches: [ "principal", "main", "master", "aldanaluis2424-crear" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar e instalar Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Compilar Android App Bundle (AAB)
      run: gradle :app:bundleRelease
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Subir Artifact AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/bundle/release/*.aab
