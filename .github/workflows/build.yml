name: Build Android Bundle Definitivo

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Entorno Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar y Configurar Gradle 9.3.1 (Exigido por AGP 9.1.1)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configurar gradle.properties para compatibilidad de Compose
        run: |
          echo "kotlin.compiler.suppressKotlinVersionCompatibilityCheck=true" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=true" >> gradle.properties

      - name: Crear local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Crear archivos de entorno (.env y .env.example)
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env.example

      - name: Generar google-services.json si no existe
        run: |
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"123456789","project_id":"app-tora","storage_bucket":"app-tora.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:123456","android_client_info":{"package_name":"com.example.apptora"}},"api_key":[{"current_key":"AIzaSyDummyKey"}]}]}' > app/google-services.json
          fi

      - name: Compilar AAB de Release Directamente
        run: gradle bundleRelease --stacktrace --console=plain
