name: Build Android Bundle Definitivo

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Entorno Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar y Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configurar gradle.properties para compatibilidad
        run: |
          echo "kotlin.compiler.suppressKotlinVersionCompatibilityCheck=true" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=true" >> gradle.properties

      - name: Preparar Claves y Variables de Entorno
        run: |
          API_KEY="${{ secrets.GEMINI_API_KEY }}"
          if [ -z "$API_KEY" ]; then
            API_KEY="DUMMY_KEY_FOR_BUILD"
          fi
          
          # Escribir en local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=\"$API_KEY\"" >> local.properties
          
          # Escribir en gradle.properties
          echo "GEMINI_API_KEY=\"$API_KEY\"" >> gradle.properties
          
          # Escribir en .env y .env.example
          echo "GEMINI_API_KEY=\"$API_KEY\"" > .env
          echo "GEMINI_API_KEY=\"$API_KEY\"" > .env.example

      - name: Generar google-services.json coincidiendo con el paquete de la App
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"123456789012","project_id":"app-tora-ia","storage_bucket":"app-tora-ia.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.torahia.kxpq"}},"api_key":[{"current_key":"AIzaSyDummyKeyForBuild123456789"}]}],"configuration_version":"1"}' > app/google-services.json
          fi

      # Crea automáticamente el archivo my-upload-key.jks para que la firma no falle
      - name: Preparar Keystore de Firma (my-upload-key.jks)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
          else
            keytool -genkeypair -alias "${{ secrets.KEY_ALIAS || 'my-key-alias' }}" -keyalg RSA -keysize 2048 -validity 10000 -keystore my-upload-key.jks -storepass "${{ secrets.KEYSTORE_PASSWORD || 'android' }}" -keypass "${{ secrets.KEY_PASSWORD || 'android' }}" -dname "CN=Android,OU=Android,O=Android,L=Android,ST=Android,C=US"
          fi
          cp my-upload-key.jks app/my-upload-key.jks

      - name: Compilar AAB de Release Directamente
        run: gradle bundleRelease --stacktrace --console=plain

      - name: Subir Archivo AAB a Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: '**/build/outputs/bundle/release/*.aab'
          retention-days: 7
