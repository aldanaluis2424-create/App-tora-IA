name: Build Android Bundle Limpio

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Crear local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "GEMINI_API_KEY=DUMMY_KEY_FOR_BUILD" >> local.properties

      - name: Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Compilar AAB
        run: gradle bundleRelease --stacktrace || gradle bundleDebug --stacktrace

      - name: Subir Archivo AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-aab-package
          path: '**/build/outputs/bundle/**/*.aab'
