name: Build Android Bundle Limpio

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Crear local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "GEMINI_API_KEY=DUMMY_KEY_FOR_BUILD" >> local.properties

      - name: Configurar Gradle sin Caché Externa
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Generar Wrapper y Compilar AAB
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew bundleRelease || ./gradlew bundleDebug

      - name: Subir Archivo AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-aab-package
          path: '**/build/outputs/bundle/**/*.aab'
