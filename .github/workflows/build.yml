name: Build Android Bundle Definitivo

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Crear local.properties (Requerido por AI Studio)
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "GEMINI_API_KEY=DUMMY_KEY_FOR_BUILD" >> local.properties

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generar Wrapper y Compilar AAB
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew bundleRelease || ./gradlew bundleDebug

      - name: Subir Paquete AAB Resultante
        uses: actions/upload-artifact@v4
        with:
          name: app-aab-package
          path: '**/build/outputs/bundle/**/*.aab'
